# OmniACS Docker Stack — Gestión de ONUs (TR-069 + VPN L2TP) multi-ISP

services:
  # ============================================
  # PostgreSQL - Base de datos principal
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: omnisync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-omnisync}
      POSTGRES_USER: ${DB_USER:-omnisync}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme_postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    ports:
      - "5432:5432"
    networks:
      - omnisync-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-omnisync}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================
  # API Backend - Node.js/Express
  # ============================================
  api:
    build: ./api
    container_name: omnisync-api
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-omnisync}
      DB_USER: ${DB_USER:-omnisync}
      DB_PASSWORD: ${DB_PASSWORD:-changeme_postgres}
      JWT_SECRET: ${JWT_SECRET:-changeme_jwt_secret_min_32_chars}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      MIKROTIK_HOST: ${MIKROTIK_HOST:-192.168.88.1}
      MIKROTIK_PORT: ${MIKROTIK_PORT:-443}
      MIKROTIK_USER: ${MIKROTIK_USER:-admin}
      MIKROTIK_PASS: ${MIKROTIK_PASS:-}
      BACKUP_DIR: /opt/omnisync/backups
      GENIEACS_NBI_URL: ${GENIEACS_NBI_URL:-http://genieacs:7557}
      # ISP único: todas las ONUs del ACS visibles sin token multi-ISP
      ACS_SINGLE_ISP: ${ACS_SINGLE_ISP:-true}
      VPS_PUBLIC_IP: ${VPS_PUBLIC_IP:-}
      L2TP_HOST: ${L2TP_HOST:-}
      L2TP_IPSEC_PSK: ${L2TP_IPSEC_PSK:-}
      L2TP_TUNNEL_NET: ${L2TP_TUNNEL_NET:-192.168.42.0/24}
      VPN_SERVER_IP: ${VPN_SERVER_IP:-192.168.42.1}
      # Escritorios remotos dedicados por ISP
      BROWSER_IMAGE: ${BROWSER_IMAGE:-lscr.io/linuxserver/chromium:latest}
      BROWSER_NETWORK: ${BROWSER_NETWORK:-omnisync_omnisync-browser-net}
      NGINX_CONTAINER: omnisync-nginx
      NGINX_DYN_DIR: /opt/omnisync/nginx-dyn
      BROWSER_PORT_MIN: 8100
      BROWSER_PORT_MAX: 8129
      # Seguridad operativa: los navegadores por ISP se habilitan sólo después
      # de validar puertos/rutas en el VPS. El navegador global sigue en 8081.
      TENANT_BROWSERS_ENABLED: ${TENANT_BROWSERS_ENABLED:-false}
      TZ: ${TZ:-America/Bogota}
    ports:
      - "3000:3000"
    volumes:
      - backup_data:/opt/omnisync/backups
      - ./nginx-dyn:/opt/omnisync/nginx-dyn
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - omnisync-net

  # ============================================
  # Nginx - Reverse Proxy + Frontend
  # ============================================
  nginx:
    image: nginx:alpine
    container_name: omnisync-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Escritorios remotos (KasmVNC necesita raíz propia, no subpath)
      - "8081:8081"   # Chromium remoto
      - "8082:8082"   # Winbox (Wine)
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-dyn:/etc/nginx/conf.d:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - omnisync-net
      - omnisync-browser-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================
  # MongoDB - Base de datos para GenieACS (TR-069)
  # ============================================
  mongo:
    # GenieACS 1.2.16 de esta imagen fue validado con MongoDB 4.4.
    image: mongo:4.4
    container_name: omnisync-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - omnisync-net
    healthcheck:
      test: ["CMD", "mongo", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ============================================
  # GenieACS - Servidor TR-069 multi-marca (ONUs)
  # CWMP :7547 | NBI :7557 | FS :7567 | UI :3001
  # ============================================
  genieacs:
    image: drumsergio/genieacs:latest
    container_name: omnisync-genieacs
    restart: unless-stopped
    environment:
      GENIEACS_MONGODB_CONNECTION_URL: mongodb://mongo:27017/genieacs
      GENIEACS_UI_JWT_SECRET: ${GENIEACS_JWT_SECRET:-changeme_genieacs_jwt_secret}
      GENIEACS_CWMP_ACCESS_LOG_FILE: /dev/stdout
      GENIEACS_NBI_ACCESS_LOG_FILE: /dev/stdout
      GENIEACS_FS_ACCESS_LOG_FILE: /dev/stdout
      GENIEACS_UI_ACCESS_LOG_FILE: /dev/stdout
      GENIEACS_UDP_CONNECTION_REQUEST_PORT: "3478"
    ports:
      - "7547:7547"          # CWMP TCP (las ONUs se conectan aquí)
      - "7547:7547/udp"      # CWMP UDP / STUN (Connection Request NAT traversal)
      - "7567:7567"          # File Server (firmware/config)
      - "7557:7557"          # NBI (API GenieACS)
      - "3001:3000"          # UI GenieACS
    depends_on:
      - mongo
    networks:
      - omnisync-net

  # ============================================
  # coturn - STUN (NAT traversal para ONUs sin VPN)
  # ============================================
  coturn:
    image: coturn/coturn:latest
    container_name: omnisync-coturn
    restart: unless-stopped
    network_mode: host
    command:
      - --listening-port=3478
      - --realm=omnisync
      - --lt-cred-mech
      - --user=acs:acs
      - --no-dynamic-ip-list
      - --no-tls
      - --no-dtls
      - --no-cli
      - --min-port=49152
      - --max-port=49200
    logging:
      driver: "none"

  # ============================================
  # WireGuard VPN - alternativa a L2TP (opcional)
  # Iniciar sólo si se necesita: docker compose --profile wireguard up -d
  # ============================================
  wireguard:
    image: lscr.io/linuxserver/wireguard:latest
    container_name: omnisync-wireguard
    restart: "no"
    profiles: ["wireguard"]
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Bogota}
    volumes:
      - wireguard_config:/config
    ports:
      - "${WG_PORT:-51820}:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
      - net.ipv4.ip_forward=1
    networks:
      - omnisync-net

  # ============================================
  # Navegador remoto (Firefox real) — acceso a ONUs/antenas por la VPN
  # Se muestra dentro del panel en /browser/
  # ============================================
  remote-browser:
    # Chromium + KasmVNC SIN contraseña propia: el acceso lo protege OmniSync
    # (Nginx auth_request valida el token de sesión contra la API).
    image: lscr.io/linuxserver/chromium:latest
    container_name: omnisync-browser
    restart: unless-stopped
    shm_size: "1gb"
    # Necesario en kernels/libseccomp antiguos (p. ej. algunos VPS Contabo).
    # Evita: CanCreateUserNamespace() clone() failure: EPERM.
    security_opt:
      - seccomp=unconfined
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Bogota}
      # Incógnito forzado + sin gestor de contraseñas: no persisten cookies ni historial.
      CHROME_CLI: --incognito --disable-sync --no-first-run --no-default-browser-check --password-store=basic --disable-features=Translate,AutofillServerCommunication ${BROWSER_HOME_URL:-about:blank}
    # Sin resolución DNS pública: sólo IPs privadas por la VPN.
    dns:
      - 127.0.0.1
    volumes:
      - browser_config:/config
      # Quita bloqueos de perfil de Chromium al arrancar (SingletonLock).
      - ./browser/root/custom-cont-init.d:/custom-cont-init.d:ro
    # Perfil en memoria: se borra al reiniciar, nada queda en disco.
    tmpfs:
      - /config/.config/chromium:mode=1777,size=512m
      - /config/.cache:mode=1777,size=256m
    # Red aislada: el navegador NO ve api/postgres/mongo/genieacs.
    # Sólo Nginx (que está en ambas redes) puede alcanzarlo.
    networks:
      - omnisync-browser-net

  # ============================================
  # Winbox nativo bajo Wine (escritorio XFCE + KasmVNC)
  # Acceso a MikroTik por la VPN, protegido por la sesión de OmniSync en /winbox/
  # ============================================
  remote-winbox:
    build:
      context: ./winbox
    image: omnisync/winbox:latest
    container_name: omnisync-winbox
    restart: unless-stopped
    shm_size: "512mb"
    security_opt:
      - seccomp=unconfined
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ:-America/Bogota}
      TITLE: "Winbox — OmniSync"
    volumes:
      - winbox_config:/config
    networks:
      - omnisync-browser-net

volumes:
  postgres_data:
  backup_data:
  wireguard_config:
  browser_config:
  winbox_config:
  mongo_data:

networks:
  omnisync-net:
    driver: bridge
  # Red dedicada de los escritorios remotos. Subred fija para poder aplicar
  # reglas de firewall (sin salida a internet) en el host: browser-firewall.sh
  # Sin `name:` fijo: forzarlo obligaba a Docker a recrear la red y fallaba
  # ("network has active endpoints"), dejando Nginx sin reiniciar.
  omnisync-browser-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.42.0/24
