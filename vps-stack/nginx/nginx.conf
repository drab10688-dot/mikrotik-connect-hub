worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 500m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

    server {
        listen 80;
        server_name _;

        # Frontend (React SPA)
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # API Proxy — dynamic resolution to avoid startup failures
        location /api/ {
            resolver 127.0.0.11 valid=30s;
            set $api_upstream http://api:3000;
            limit_req zone=api burst=20 nodelay;
            proxy_pass $api_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # Auth rate limiting (stricter)
        location /api/auth/ {
            resolver 127.0.0.11 valid=30s;
            set $api_auth_upstream http://api:3000;
            limit_req zone=auth burst=3 nodelay;
            proxy_pass $api_auth_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }




        # ── TR-069 por ISP ────────────────────────────────────────
        # Cada ISP recibe su propio enlace:  http://<host>/tr069/<token>/
        # Todos apuntan al mismo GenieACS; el token identifica al ISP.
        location ~ "^/tr069/([a-f0-9]{8,64})/?(.*)$" {
            resolver 127.0.0.11 valid=30s;
            set $acs_upstream http://genieacs:7547;
            set $tenant_token $1;
            proxy_pass $acs_upstream/$2$is_args$args;
            proxy_set_header Host $host;
            proxy_set_header X-Tenant-Token $tenant_token;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # Navegador remoto (Firefox + KasmVNC)
        # Verifica el token de sesión de OmniSync antes de abrir el escritorio remoto.
        # La API recibe la URI original (con ?token=) en X-Original-URI.
        location = /api/browser-authz {
            internal;
            resolver 127.0.0.11 valid=30s;
            proxy_pass http://api:3000/api/browser-authz;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        location /browser/ {
            auth_request /api/browser-authz;
            resolver 127.0.0.11 valid=30s;
            set $browser_upstream http://remote-browser:3000/;
            proxy_pass $browser_upstream;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # GenieACS UI (TR-069)
        location /genieacs/ {
            set $genieacs_upstream genieacs;
            proxy_pass http://$genieacs_upstream:3000/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }
    }
}